<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progicart • Everything delivered in 10 minutes</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Official Razorpay Production Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  </head>
  <body>
    <div id="root">
      <!-- Instant Zero-Delay Pre-Splash (Replaced instantly when React mounts) -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%, #FFFFFF 0%, #F4FBF5 65%, #EAF8ED 100%);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:999999;">
        <div style="background:#FFFFFF;padding:22px 32px;border-radius:20px;box-shadow:0 14px 34px rgba(22,138,50,0.12);border:1px solid #E5EAE6;text-align:center;">
          <img src="/logo.png" alt="Progicart" style="height:54px;max-width:240px;object-fit:contain;display:block;margin:0 auto;" />
          <div style="margin-top:14px;background:#168A32;color:#FFFFFF;font-size:12px;font-weight:700;padding:4px 12px;border-radius:9999px;letter-spacing:0.4px;display:inline-block;">⚡ 10 MINS DELIVERY</div>
        </div>
        <div style="margin-top:20px;font-size:16px;font-weight:700;color:#171A18;">Everything delivered in <span style="color:#168A32;">10 minutes</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
