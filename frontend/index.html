<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progicart • Everything delivered in 10 minutes</title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Instant Zero-Delay Pre-Splash (Replaced instantly when React mounts) -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%, #ffffff 0%, #f0fdf4 65%, #dcfce7 100%);font-family:'Plus Jakarta Sans',sans-serif;z-index:999999;">
        <div style="background:#ffffff;padding:22px 32px;border-radius:24px;box-shadow:0 14px 34px rgba(12,131,31,0.14);border:1.5px solid rgba(167,243,208,0.7);text-align:center;">
          <img src="/logo.png" alt="Progicart" style="height:54px;max-width:240px;object-fit:contain;display:block;margin:0 auto;" />
          <div style="margin-top:14px;background:#0c831f;color:#ffffff;font-size:12px;font-weight:800;padding:4px 12px;border-radius:9999px;letter-spacing:0.5px;display:inline-block;">⚡ 10 MINS DELIVERY</div>
        </div>
        <div style="margin-top:20px;font-size:16px;font-weight:800;color:#111827;">Everything delivered in <span style="color:#0c831f;">10 minutes</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
